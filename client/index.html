<!doctype html>
<!-- lang/dir: the shell's are English, and scripts/prerender-head.mjs stamps
     each file it emits with that URL's own pair. main.tsx rewrites both
     before React mounts as well, so a /he load paints RTL on frame 1 either
     way; they're spelled out here so the attributes always exist and the
     first layout can't reflow from a missing dir. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget: the on-screen keyboard resizes the layout viewport
         (Android Chrome), so dvh-sized screens shrink and inputs land above
         the keys instead of the browser panning the page. iOS ignores it.
         viewport-fit=cover: without it iOS letterboxes the page inside the
         notch and home-indicator bars AND reports every env(safe-area-inset-*)
         as 0. With it the page runs edge to edge under that chrome, and the
         env() paddings in StudentWorldLayout, AppLayout's navbar, DemoBanner,
         and the teacher setup dock are what keep content out of it. Never add
         one without the other. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6C4BE0" />
    <!-- The FALLBACK pair. `scripts/prerender-head.mjs` copies the built shell
         to dist/app.html and stamps a head into a file per public URL (two
         shapes each), so every one of the ten unfurls as itself;
         vercel.json's catch-all
         points at app.html, which keeps THIS pair. What still reads it: a real
         host session, a real 4-digit join code, the 404.
         THERE ARE NOW TWO FALLBACKS, and the /he prefix picks between them.
         vercel.json rewrites /he/… to dist/he-app.html — the same shell,
         stamped Hebrew from the `shell.description` key in the common catalog,
         so a Hebrew session URL is Hebrew in the tab and in an unfurl. Every
         unprefixed URL still lands here, including one a Hebrew-preferring
         visitor opened: the path carries no preference for the server to read,
         and boot corrects the page a moment later. That is the honest limit of
         a static fallback, and it is written down rather than chased.
         Third person on purpose — it has to read correctly on a student URL
         too. The title stays the bare brand for the same reason it always did:
         nothing stamps a title before React mounts, so this is what sits in the
         tab during the lazy page fetch, and a full English sentence there would
         flash English at a Hebrew student on school wifi.
         The three markers below — the <html> tag above, this description tag,
         and the <title> — are matched LITERALLY by the prerender script, which
         throws unless each matches exactly once. Editing them is editing a
         contract; the build goes red, it does not go quiet. -->
    <meta
      name="description"
      content="A classroom roleplay activity where students chat in character about their lessons. Teachers follow every conversation live."
    />
    <title>Chaverola</title>
    <!-- og:fallback:start — a FOURTH marker, and the only one that gets
         deleted. scripts/prerender-head.mjs removes everything through the end
         marker below from each file it stamps and writes that page's own card
         in its place (prerenderMeta's `socialCard`), because two og:titles in
         one head is one too many and which of them an unfurler reads is not
         worth guessing at. So this block is app.html's card: the real host
         session, the real join code, the 404, every /he/… session.
         The fallback unfurl card, read by Slack, WhatsApp, iMessage, LinkedIn
         and a Gmail compose window.
         og:title and og:description are the two strings above, not a third set
         written for social: there is no evidence a different sentence performs
         better, and a third set is a third thing to keep in sync. The title
         stays the bare brand for the reason the <title> does — it serves
         unmatched URLs, student sessions included.
         og:url and og:image MUST be absolute; most unfurlers ignore a relative
         image. The origin is SITE_ORIGIN in src/lib/prerenderMeta.ts, and these
         two literals are its only mirror — a static shell can't import. Same
         for og:image:alt, which is `share.cardAlt` in the common catalog and
         has a Hebrew twin there; only the stamped pages can read it.
         No og:locale pair here on purpose: this block STILL serves both
         languages — every unprefixed URL, whoever opened it — and a page that
         claims en_US to a Hebrew reader is worse than a page that claims
         nothing. he-app.html does carry the pair, because it serves one
         language and so cannot be wrong about it.
         twitter:card is the ONLY twitter:* tag here, and the omission is
         deliberate. X and every other consumer of those tags falls back to the
         og:* equivalents for title, description and image, so a parallel
         twitter:title / :description / :image set would be three more strings
         to keep in sync for no change in what anyone sees.
         og-card.png carries the same gradient literals as LogoMark and
         favicon.svg, so it re-renders when they move — see the pinned-mirror
         note in src/components/brand/Logo.tsx. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chaverola" />
    <meta property="og:title" content="Chaverola" />
    <meta
      property="og:description"
      content="A classroom roleplay activity where students chat in character about their lessons. Teachers follow every conversation live."
    />
    <meta property="og:url" content="https://chaverola.com/" />
    <meta property="og:image" content="https://chaverola.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Chaverola logo, a white speech bubble with a smiling face, on a purple card."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:fallback:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
